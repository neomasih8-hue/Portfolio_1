<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Scientific Calculator</title>
<style>
:root{--bg:#0b1020;--panel:#111a2e;--screen:#0b1326;--key:#1b2943;--key2:#243653;--accent:#7c5cff;--cyan:#42d9e8;--text:#eef3ff;--muted:#93a4c4;--danger:#ff7185}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 5%,#20235a 0,transparent 35%),radial-gradient(ellipse at 90% 90%,#103e53 0,transparent 32%),var(--bg);font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--text);display:grid;place-items:center;padding:22px}
.app{width:min(100%,980px);display:grid;grid-template-columns:minmax(320px,1fr) 260px;gap:18px}
.calculator,.history{background:rgba(17,26,46,.92);border:1px solid #293856;border-radius:26px;box-shadow:0 25px 80px #0007;backdrop-filter:blur(18px)}
.calculator{padding:22px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.4px}.logo{width:35px;height:35px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--cyan));display:grid;place-items:center;color:white;font-size:20px}.tag{font-size:11px;color:var(--cyan);border:1px solid #28586b;border-radius:99px;padding:6px 9px;letter-spacing:1px}
.screen{background:linear-gradient(135deg,#091225,#111e37);border:1px solid #263653;border-radius:19px;padding:17px 18px;margin-bottom:16px;min-height:126px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}.screen-label{color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}.expression{font-size:clamp(20px,4vw,31px);min-height:38px;overflow-wrap:anywhere;text-align:right;color:#dce6ff}.result{font-size:clamp(28px,5vw,42px);font-weight:750;letter-spacing:-1px;text-align:right;overflow-wrap:anywhere;color:white}.result small{font-size:12px;color:var(--cyan);font-weight:500;letter-spacing:1px}
.controls{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}.pill{border:1px solid #344768;background:#17243b;color:#cbd7f0;border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:700}.pill.active{background:#332c68;border-color:#7867ef;color:#fff}.keypad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.key{min-height:53px;border:1px solid #2a3b5a;border-radius:14px;background:linear-gradient(180deg,#20304d,#18253e);color:var(--text);font-size:16px;font-weight:650;cursor:pointer;transition:transform .12s,border-color .12s,filter .12s;user-select:none}.key:hover{border-color:#657ca7;filter:brightness(1.15)}.key:active{transform:scale(.96)}.key.fn{color:#9fafff;background:#192449}.key.op{color:var(--cyan);background:#142d3d}.key.clear{color:var(--danger)}.key.equals{background:linear-gradient(135deg,#795cff,#4e7dff);border:0;box-shadow:0 8px 22px #634fff4d;font-size:22px}.key.zero{grid-column:span 2}.history{padding:20px;display:flex;flex-direction:column;min-height:300px}.history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.history h2{font-size:15px;margin:0}.clear-history{border:0;background:transparent;color:var(--muted);cursor:pointer}.history-list{display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:490px}.history-item{border:1px solid #293956;background:#121f35;border-radius:12px;padding:11px;cursor:pointer}.history-item:hover{border-color:var(--accent)}.hist-expr{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.hist-result{font-size:18px;font-weight:700;margin-top:4px;overflow-wrap:anywhere}.empty{color:var(--muted);font-size:13px;line-height:1.6;margin:auto;text-align:center;padding:25px 8px}.footer{color:#7184a7;font-size:11px;margin-top:14px;text-align:center}.error{color:var(--danger)!important}
@media(max-width:760px){.app{grid-template-columns:1fr;max-width:520px}.history{min-height:170px}.history-list{max-height:200px}.calculator{padding:15px}.keypad{gap:7px}.key{min-height:48px;font-size:14px}}
</style>
</head>
<body>
<div class="app">
 <main class="calculator">
  <div class="top"><div class="brand"><div class="logo">∑</div><div> NOVA <span style="color:var(--muted);font-weight:500">/ SCIENTIFIC</span></div></div><div class="tag">OFFLINE READY</div></div>
  <section class="screen">
   <div class="screen-label">Expression</div><div id="expression" class="expression">0</div>
   <div><div class="screen-label" style="text-align:right">Result</div><div id="result" class="result">0</div></div>
  </section>
  <div class="controls">
   <div style="display:flex;gap:7px"><button class="pill active" id="deg">DEG</button><button class="pill" id="rad">RAD</button></div>
   <button class="pill" id="ansBtn">ANS: 0</button><button class="pill" id="back">⌫ Back</button>
  </div>
  <div class="keypad" id="keys">
   <button class="key fn" data-v="sin(">sin</button><button class="key fn" data-v="cos(">cos</button><button class="key fn" data-v="tan(">tan</button><button class="key fn" data-v="log(">log</button><button class="key fn" data-v="ln(">ln</button>
   <button class="key fn" data-v="asin(">sin⁻¹</button><button class="key fn" data-v="sqrt(">√</button><button class="key fn" data-v="^2">x²</button><button class="key fn" data-v="^">xʸ</button><button class="key fn" data-v="!">n!</button>
   <button class="key fn" data-v="π">π</button><button class="key fn" data-v="e">e</button><button class="key fn" data-v="(">(</button><button class="key fn" data-v=")">)</button><button class="key op" data-v="/">÷</button>
   <button class="key" data-v="7">7</button><button class="key" data-v="8">8</button><button class="key" data-v="9">9</button><button class="key clear" data-action="clear">AC</button><button class="key op" data-v="*">×</button>
   <button class="key" data-v="4">4</button><button class="key" data-v="5">5</button><button class="key" data-v="6">6</button><button class="key op" data-v="-">−</button><button class="key op" data-v="%">mod</button>
   <button class="key" data-v="1">1</button><button class="key" data-v="2">2</button><button class="key" data-v="3">3</button><button class="key op" data-v="+">+</button><button class="key fn" data-v="Ans">Ans</button>
   <button class="key zero" data-v="0">0</button><button class="key" data-v=".">.</button><button class="key" data-action="sign">±</button><button class="key equals" data-action="equals">=</button>
  </div>
  <div class="footer">Keyboard supported · Click a past result to reuse it</div>
 </main>
 <aside class="history">
  <div class="history-head"><h2>Calculation history</h2><button class="clear-history" id="clearHistory">Clear</button></div>
  <div id="historyList" class="history-list"><div class="empty">Your calculations will appear here.<br>Let's solve something.</div></div>
 </aside>
</div>
<script>
const $=id=>document.getElementById(id);
let expr='', answer=0, degrees=true, history=[];
const display=()=>{$('expression').textContent=expr||'0';$('ansBtn').textContent='ANS: '+fmt(answer)};
function fmt(n){if(!Number.isFinite(n))throw Error('Result is not a finite number');if(Math.abs(n)<1e-13)return '0';return Number(n.toPrecision(12)).toString()}
function insert(v){if(expr==='0'&&/^\d$/.test(v))expr=v;else expr+=v;display();$('result').classList.remove('error')}
function fact(n){if(n<0||!Number.isInteger(n)||n>170)throw Error('Factorial needs an integer from 0 to 170');let r=1;for(let i=2;i<=n;i++)r*=i;return r}
function calculate(s){
 if(!s.trim())return 0;
 let x=s.replace(/π/g,'Math.PI').replace(/\bAns\b/g,'('+answer+')').replace(/\be\b/g,'Math.E');
 x=x.replace(/(\d+(?:\.\d+)?|Math\.PI|Math\.E|\))!/g,'fact($1)');
 x=x.replace(/\^/g,'**').replace(/×/g,'*').replace(/÷/g,'/');
 const funcs={sin:'sin',cos:'cos',tan:'tan',asin:'asin',acos:'acos',atan:'atan',sqrt:'sqrt',ln:'log',log:'log10',abs:'abs',floor:'floor',ceil:'ceil'};
 for(const [name,fn] of Object.entries(funcs)){
   const re=new RegExp('\\b'+name+'\\s*\\(','g');
   if(['sin','cos','tan'].includes(name)) x=x.replace(re,`Math.${fn}((degrees ? (Math.PI/180)*(`);
   else if(['asin','acos','atan'].includes(name)) x=x.replace(re,`(degrees ? (180/Math.PI)*Math.${fn}(`);
   else x=x.replace(re,`Math.${fn}(`);
 }
 // Close angle-conversion wrapper for direct trig calls by rewriting balanced function expressions.
 // The simple replacements above are normalized by this pass.
 x=x.replace(/Math\.sin\(\(degrees \? \(Math\.PI\/180\)\*\(/g,'Math.sin((degrees ? (Math.PI/180)*(')
 // Convert trigonometric calls robustly by using an expression parser transformation.
 x=transformTrig(s);
 if(!/^[0-9+\-*/().,\s%!*A-Za-z_]+$/.test(x))throw Error('Invalid expression');
 if(/\b(?:window|document|globalThis|constructor|prototype|import)\b/.test(x))throw Error('Invalid expression');
 const value=Function('Math','fact','degrees','return ('+x+')')(Math,fact,degrees);
 if(typeof value!=='number'||!Number.isFinite(value))throw Error('Math error: check your expression');
 return value;
}
function transformTrig(s){
 let x=s.replace(/π/g,'Math.PI').replace(/\bAns\b/g,'('+answer+')').replace(/\be\b/g,'Math.E');
 // Rewrite function names and their single balanced argument safely.
 const names={sin:'sin',cos:'cos',tan:'tan',asin:'asin',acos:'acos',atan:'atan',sqrt:'sqrt',ln:'log',log:'log10',abs:'abs',floor:'floor',ceil:'ceil'};
 let out='',i=0;
 while(i<x.length){
  const m=x.slice(i).match(/^([A-Za-z]+)\s*\(/);
  if(m&&names[m[1]]){
   const name=m[1], open=i+m[0].length-1;let depth=1,j=open+1;
   while(j<x.length&&depth){if(x[j]==='(')depth++;else if(x[j]===')')depth--;j++}
   if(depth)throw Error('Missing closing parenthesis');
   const arg=transformTrig(x.slice(open+1,j-1));
   let val;
   if(name==='sin'||name==='cos'||name==='tan') val=`Math.${name}((degrees ? Math.PI/180 : 1)*(${arg}))`;
   else if(name==='asin'||name==='acos'||name==='atan') val=`((degrees ? 180/Math.PI : 1)*Math.${name}(${arg}))`;
   else val=`Math.${names[name]}(${arg})`;
   out+=val;i=j;
  }else{out+=x[i];i++}
 }
 out=out.replace(/(\d+(?:\.\d+)?|Math\.PI|Math\.E|\))!/g,'fact($1)').replace(/\^/g,'**').replace(/%/g,'%');
 // implicit multiplication e.g. 2π, 2(3+4), (2+3)(4+5), 2Math.PI
 out=out.replace(/(\d|\)|Math\.PI|Math\.E)(?=(Math\.PI|Math\.E|\(|[A-Za-z]))/g,'$1*');
 return out;
}
function run(){
 try{const value=calculate(expr);answer=value;$('result').classList.remove('error');$('result').textContent=fmt(value);history.unshift({e:expr||'0',r:fmt(value)});history=history.slice(0,40);renderHistory();display();}
 catch(err){$('result').textContent=err.message||'Error';$('result').classList.add('error')}
}
function renderHistory(){const list=$('historyList');list.innerHTML='';if(!history.length){list.innerHTML='<div class="empty">Your calculations will appear here.</div>';return}history.forEach(item=>{const el=document.createElement('div');el.className='history-item';const a=document.createElement('div');a.className='hist-expr';a.textContent=item.e;const b=document.createElement('div');b.className='hist-result';b.textContent='= '+item.r;el.append(a,b);el.onclick=()=>{expr=item.e;display();run()};list.append(el)})}
$('keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action==='clear'){expr='';$('result').textContent='0';$('result').classList.remove('error');display()}else if(b.dataset.action==='equals')run();else if(b.dataset.action==='sign'){expr=expr.startsWith('-')?expr.slice(1):'-('+expr+')';display()}else if(b.dataset.v)insert(b.dataset.v)});
$('back').onclick=()=>{expr=expr.slice(0,-1);display()};$('deg').onclick=()=>{degrees=true;$('deg').classList.add('active');$('rad').classList.remove('active')};$('rad').onclick=()=>{degrees=false;$('rad').classList.add('active');$('deg').classList.remove('active')};$('clearHistory').onclick=()=>{history=[];renderHistory()};$('ansBtn').onclick=()=>insert('Ans');
document.addEventListener('keydown',e=>{if(/^[0-9.]$/.test(e.key))insert(e.key);else if(['+','-','*','/','(',')','%','^','!'].includes(e.key))insert(e.key);else if(e.key==='Enter'||e.key==='='){e.preventDefault();run()}else if(e.key==='Backspace'){expr=expr.slice(0,-1);display()}else if(e.key==='Escape'){expr='';$('result').textContent='0';display()}});
display();
</script>
</body>
</html>
